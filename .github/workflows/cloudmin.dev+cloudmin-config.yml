name: Package and upload artifacts

on:
  push:
    branches:
      - main
  release:
    types:
      - prereleased
      - released
  workflow_dispatch:
    inputs:
      force-release:
        type: boolean
        default: true
        description: "Build a release package"
      version:
        type: string
        description: "Release version, e.g. 10.0.0"

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PKG_RELEASE: ${{ github.run_attempt }}
  PKG_NAME: "cloudmin-config"
  PKG_MAINTAINER: "Ilia Ross <ilia@webmin.dev>"
  PKG_VENDOR: "Cloudmin, LLC"
  PKG_DESC: "Configure and verify a Cloudmin KVM host using Webmin service and firewall APIs."
  PKG_HOMEPAGE: "https://github.com/virtualmin/Cloudmin-Config"
  PKG_SUMMARY: "Configure a system for use by Cloudmin"
  IS_RELEASE: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.force-release) }}
  IS_PRERELEASE: ${{ github.event.release.prerelease || false }}

  BUILD_DEPS: "git tar curl gzip make rpm dpkg-dev fakeroot coreutils liblog-log4perl-perl libmodule-load-perl libxml-libxml-perl libsys-virt-perl"
  BUILD_BOOTSTRAP: "https://raw.githubusercontent.com/webmin/webmin-ci-cd/main/build/bootstrap.bash"

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'virtualmin/Cloudmin-Config' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[no-build]')) }}
    env:
      TZ: Europe/Belgrade
    steps:
      - uses: actions/checkout@v4
      
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with: 
          packages: ${{ env.BUILD_DEPS }}
          version: 1.0

      - name: Fetch dependencies
        run: curl --fail --show-error --location -O "$BUILD_BOOTSTRAP"

      - name: Build packages
        env:
          CLOUD__IP_ADDR: ${{ secrets.DEV_IP_ADDR }}
          CLOUD__IP_KNOWN_HOSTS: ${{ secrets.DEV_IP_KNOWN_HOSTS }}
          CLOUD__UPLOAD_SSH_USER: ${{ secrets.DEV_UPLOAD_SSH_USER }}
          CLOUD__UPLOAD_SSH_DIR: ${{ env.IS_RELEASE == 'true' && secrets.PRERELEASE_UPLOAD_SSH_DIR || secrets.DEV_UPLOAD_SSH_DIR }}
          CLOUD__SSH_PRV_KEY: ${{ secrets.DEV_SSH_PRV_KEY }}
          CLOUD__GPG_PH2: ${{ secrets.ALL_GPG_PH2 }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |-

          # Fail on error
          set -euo pipefail
          
          # Bootstrap build
          source bootstrap.bash \
            $([[ "$IS_RELEASE" == "true" ]] && echo "--release" || echo "--testing") \
            $([[ "$IS_PRERELEASE" == "true" ]] && echo "--prerelease")

          # Release tags and manual builds supply the published version.
          if [ "$IS_RELEASE" = "true" ]; then
            pkg_version="${MANUAL_VERSION:-${RELEASE_TAG:-}}"
            pkg_version="${pkg_version#v}"
            pkg_section="admin"
          else
            # Development builds follow the version declared in the source.
            pkg_version=$(perl -ne 'print "$1\n" if /^\s*"VERSION"\s*=>\s*"([^"]+)"/' Makefile.PL)
            pkg_section="devel"
          fi
          if [[ ! "$pkg_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid or missing package version: $pkg_version" >&2
            exit 1
          fi
          if [ "$IS_RELEASE" != "true" ]; then
            pkg_version="${pkg_version%.*}.$(date +%Y%m%d%H%M)"
          fi

          # Set build base directory
          pkg_name="${{ env.PKG_NAME }}"
          destdirbase="$HOME/$pkg_name"

          # Build once with the RPM vendor paths; Debian reuses this output.
          perl Makefile.PL \
              VERSION="$pkg_version" \
              INSTALLDIRS=vendor \
              VENDORPREFIX=/usr \
              INSTALLVENDORLIB=/usr/share/perl5/vendor_perl \
              INSTALLVENDORBIN=/usr/bin \
              INSTALLVENDORSCRIPT=/usr/bin \
              INSTALLVENDORMAN1DIR=/usr/share/man/man1 \
              INSTALLVENDORMAN3DIR=/usr/share/man/man3 \
              NO_PACKLIST=1 \
              NO_PERLLOCAL=1
          make
          # Run isolated unit tests before assembling either package.
          make test
          make DESTDIR="$destdirbase-rpm" install

          # Include package documentation and the Cloudmin CLI entry point.
          mkdir -p "$destdirbase-rpm/usr/share/doc/$pkg_name"
          cp LICENSE README.pod "$destdirbase-rpm/usr/share/doc/$pkg_name/"
          mkdir -p "$destdirbase-rpm/usr/libexec/webmin/server-manager"
          ln -s /usr/bin/cloudmin-config-system "$destdirbase-rpm/usr/libexec/webmin/server-manager/config-system.pl"

          # Build RPM package
          build_native_package \
            --architectures noarch \
            --files "$destdirbase-rpm" \
            --target-dir "$ROOT_REPOS" \
            --base-name "$pkg_name" \
            --maintainer "${{ env.PKG_MAINTAINER }}" \
            --vendor "${{ env.PKG_VENDOR }}" \
            --version "$pkg_version" \
            --release "$PKG_RELEASE" \
            --depends perl \
            --depends "perl(File::Basename)" \
            --depends "perl(File::Path)" \
            --depends "perl(Getopt::Long)" \
            --depends "perl(Log::Log4perl)" \
            --depends "perl(Module::Load)" \
            --depends "perl(Sys::Virt)" \
            --depends "perl(XML::LibXML)" \
            --depends "perl(JSON::PP)" \
            --depends "perl(POSIX)" \
            --depends "perl(Time::HiRes)" \
            --depends "perl(Term::ANSIColor)" \
            --depends "webmin >= 2.670" \
            --depends webmin-server-manager \
            --group "Development/Libraries" \
            --spec-files-depth 3 \
            --skip deb \
            --description "${{ env.PKG_DESC }}" \
            --summary "${{ env.PKG_SUMMARY }}" \
            --homepage "${{ env.PKG_HOMEPAGE }}"
          
          # Install the same Perl build into Debian's native library directory.
          make DESTDIR="$destdirbase-deb" INSTALLVENDORLIB=/usr/share/perl5 install
          mkdir -p "$destdirbase-deb/usr/share/doc/$pkg_name"
          cp LICENSE README.pod "$destdirbase-deb/usr/share/doc/$pkg_name/"
          mkdir -p "$destdirbase-deb/usr/share/webmin/server-manager"
          ln -s /usr/bin/cloudmin-config-system "$destdirbase-deb/usr/share/webmin/server-manager/config-system.pl"
          # Use Debian dependency names for the same runtime requirements.
          build_native_package \
            --architectures noarch \
            --files "$destdirbase-deb" \
            --target-dir "$ROOT_REPOS" \
            --base-name "$pkg_name" \
            --maintainer "${{ env.PKG_MAINTAINER }}" \
            --vendor "${{ env.PKG_VENDOR }}" \
            --version "$pkg_version" \
            --release "$PKG_RELEASE" \
            --depends "perl, liblog-log4perl-perl, libmodule-load-perl, libsys-virt-perl, libxml-libxml-perl, libjson-pp-perl, webmin (>= 2.670), webmin-server-manager" \
            --section "$pkg_section" \
            --skip rpm \
            --description "${{ env.PKG_DESC }}" \
            --summary "${{ env.PKG_SUMMARY }}" \
            --homepage "${{ env.PKG_HOMEPAGE }}"

          # Upload and sign
          upload_list=("$ROOT_REPOS/"*)
          cloud_upload upload_list
          cloud_sign_and_build_repos_auto cloudmin.dev
